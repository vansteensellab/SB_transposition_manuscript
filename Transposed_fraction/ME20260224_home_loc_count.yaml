# ------------------------------------------------------------------------------
# VARIABLE CONFIGURATION:
# ------------------------------------------------------------------------------
# output_dir = Output directory for sequencing files (FASTQ).
#     Path should be a string, surrounded by quotes.
#     Path should not end with a forward slash.

output_dir:
    '/home/c.moene/projects/hopping_technology/03_hopping_eff_single_LPs/pipeline_home_loc_count/output_ME20260326'

# input_info:  tab-separated file with header and with the following columns:
# Sample_Name: name of the sample used in the output file
# file: full path to the parsed R2 file (fastq.gz)
# LP: name of the launch pad, matching an entry in this yaml file
# orientation: orientation of the mapping, fw or rv 

input_info:
    '/home/c.moene/projects/hopping_technology/03_hopping_eff_single_LPs/pipeline_home_loc_count/ME20260224_input.txt'


