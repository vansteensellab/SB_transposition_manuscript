    '/DATA/shared/projects/local_hopping/hopping_technology/03_hopping_eff_single_LPs/CM20260324_local_context'

summary_file:
    single_SB_LPs: '/DATA/shared/projects/local_hopping/hopping_technology/03_hopping_eff_single_LPs/CM20260324_LP_locations_clones.txt'

# Note that this pipeline assumes that your input summary file is a tab-separated 
# file with header and with the following columns:
# 1. name (barcode of the integration), needs to be called 'barcode'
# 2. chromosome (chromosome of the integration)
# 3. start (location of the integration)

bins:
    Omar_PB: [500, 2000, 5000, 10000]

bin_for_overlap_feature: 1
bin_for_nearest_feature: 1


#### To run this pipeline this is the script that needs to be run in conda
# cd /DATA/shared/projects/local_hopping/hopping_technology/02_Omar_clone_pools
# conda activate /DATA/usr/v.franceschini/micromamba/envs/acadias_definitive_env
# snakemake -s /DATA/pipelines/TRIP_local_context/Snakefile --configfile /DATA/shared/projects/local_hopping/hopping_technology/02_Omar_clone_pools/CM20260310_Omar_clones_local_context_config.yaml --cores 25

